version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: reporting_system
      POSTGRES_USER: drs_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretDBPassword123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - drs-network

  # 2. Spring Boot Backend
  backend:
    build: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/reporting_system
      - SPRING_DATASOURCE_USERNAME=drs_user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-SuperSecretDBPassword123}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - drs-network

  # 3. NGINX Reverse Proxy (Zero-Log)
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - drs-network

volumes:
  pgdata: # Ensures database data survives if the container restarts

networks:
  drs-network:
    driver: bridge
