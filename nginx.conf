# =============================================================================
# DIGITAL REPORTING SYSTEM (DRS) — ZERO-LOG REVERSE PROXY SPECIFICATION
# Protocol: Network-Level Anonymity & IP Scrubbing Protocol (RFC-Compliant Zero-Trace)
# Target Service: Spring Boot Monolith (Internal Port 8081)
# =============================================================================
#
# PURPOSE & THREAT MODEL:
# Even when an application collects zero personal data (no name, email, or phone),
# raw TCP/IP packets transmit client IP addresses at the transport and network layers.
# This NGINX reverse-proxy configuration sits at the edge of the infrastructure to:
# 1. Permanently strip client IP addresses before packets reach the Java Spring Boot backend.
# 2. Overwrite and drop tracking headers (X-Forwarded-For, X-Real-IP, Forwarded, Via).
# 3. Anonymize user agent footprints to prevent device fingerprinting.
# 4. Eliminate disk-persisted connection logs by disabling access logging entirely.
#
# COMBINED WITH TOR:
# For darknet access, a Tor daemon routes hidden service (.onion) traffic through
# multi-hop virtual circuits directly to this proxy or container port.
# For clearnet HTTPS access, this proxy guarantees strict zero-trace packet scrubbing.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # 1. ZERO DISK LOGGING PROTOCOL
    # Disables all request logging to disk. No IP addresses, timestamps, or URLs
    # are written to storage. Error logs are restricted to critical failures and
    # routed to volatile /dev/null memory.
    # -------------------------------------------------------------------------
    access_log off;
    error_log /dev/null crit;

    # Basic performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Strip Nginx version token to avoid fingerprinting

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream Spring Boot Application Server
    upstream spring_boot_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Client body limit for scene photographs / evidence uploads (max 10MB)
        client_max_body_size 10M;

        # ---------------------------------------------------------------------
        # 2. PRIVACY & SECURITY HEADERS
        # Prevent browser metadata leakage, referrer leakage, and clickjacking
        # ---------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

        location / {
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;

            # -----------------------------------------------------------------
            # 3. STRICT IP SCRUBBING & METADATA DROPPING
            # Explicitly drops X-Forwarded-For and X-Real-IP so the Spring Boot
            # backend receives a sanitized connection originating from 127.0.0.1.
            # -----------------------------------------------------------------
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
            proxy_set_header Via "";

            # Anonymize User-Agent to mitigate browser fingerprinting across requests
            proxy_set_header User-Agent "DRS-Anonymous-Client/1.0 (Zero-Knowledge Verified)";

            # Preserve host context for internal routing
            proxy_set_header Host $host;

            # Prevent caching of confidential API payloads in intermediate proxies
            proxy_buffering off;
        }

        # Health probe endpoint for cloud infrastructure (Render / Kubernetes)
        location /health {
            proxy_pass http://spring_boot_backend/api/dashboard;
            access_log off;
        }
    }
}
