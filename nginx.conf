events {
    worker_connections 1024;
}

http {
    # Strict Zero-Log Clearnet Ingress Configuration
    access_log off;
    error_log /dev/null crit;

    server {
        listen 80;

        location / {
            # Route traffic to the Spring Boot container on port 8081
            proxy_pass http://backend:8081;

            # Scrub all incoming TCP socket IP addresses
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Remote-Addr "";
            proxy_set_header User-Agent "DRS-Anonymous-Client/1.0";
            proxy_hide_header Via;
        }
    }
}
