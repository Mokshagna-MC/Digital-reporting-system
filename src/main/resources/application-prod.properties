# =============================================================================
# Production Configuration (Cloud Deployment: Render / Railway)
# =============================================================================
spring.application.name=digital-reporting-system

# Automatically overridden in cloud via environment variables:
# DATABASE_URL or SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/reporting_system}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:mokshagna0402}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatic table management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cloud port binding (Render/Railway inject $PORT)
server.port=${PORT:8080}

