# =============================================================================
# Production Configuration (Cloud Deployment: Render / Railway)
# =============================================================================
spring.application.name=digital-reporting-system

# Automatically overridden in cloud via environment variables:
# DATABASE_URL or SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/reporting_system}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:mokshagna0402}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatic table management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloud port binding (Render/Railway inject $PORT)
server.port=${PORT:8080}

# =============================================================================
# NETWORK-LEVEL ANONYMITY & IP SCRUBBING PROTOCOL (PRODUCTION)
# =============================================================================
# Completely disables access logging to preserve zero-trace anonymous reporting.
server.tomcat.accesslog.enabled=false
server.forward-headers-strategy=none


# =============================================================================
# HIKARICP ENTERPRISE CONNECTION POOLING (High-Traffic Concurrency)
# =============================================================================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=DRSHikariProdPool
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================================================
# SPRING CACHE CONFIGURATION (PRODUCTION)
# =============================================================================
spring.cache.type=simple
spring.cache.cache-names=publicReports,dashboardMetrics
