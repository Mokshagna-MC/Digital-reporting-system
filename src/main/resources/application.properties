spring.application.name=digital-reporting-system

# PostgreSQL Database Connection (Neon Cloud Serverless PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-damp-paper-ao9isrxv.c-2.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_ODLZvf7cu9Uk}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA configuration (automatically creates and updates tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port (dynamically binds to Render's ${PORT} in cloud, defaults to 8081 locally)
server.port=${PORT:8081}

# =============================================================================
# NETWORK-LEVEL ANONYMITY & IP SCRUBBING PROTOCOL
# =============================================================================
# Disables embedded Tomcat HTTP access logging entirely. Prevents incoming
# client IP addresses, socket descriptors, and request paths from persisting to disk.
server.tomcat.accesslog.enabled=false
# Drops untrusted forwarded headers to prevent spoofed IP injection
server.forward-headers-strategy=none

# =============================================================================
# HIKARICP ENTERPRISE CONNECTION POOLING (High-Traffic Concurrency)
# =============================================================================
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=DRSHikariPool
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================================================
# SPRING CACHE CONFIGURATION
# =============================================================================
spring.cache.type=simple
spring.cache.cache-names=publicReports,dashboardMetrics
