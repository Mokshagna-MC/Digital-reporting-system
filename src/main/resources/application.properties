spring.application.name=digital-reporting-system

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/reporting_system
spring.datasource.username=postgres
spring.datasource.password=mokshagna0402
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA configuration (automatically creates and updates tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port (8081 avoids conflict with existing httpd/Apache on port 8080)
server.port=8081

# =============================================================================
# NETWORK-LEVEL ANONYMITY & IP SCRUBBING PROTOCOL
# =============================================================================
# Disables embedded Tomcat HTTP access logging entirely. Prevents incoming
# client IP addresses, socket descriptors, and request paths from persisting to disk.
server.tomcat.accesslog.enabled=false
# Drops untrusted forwarded headers to prevent spoofed IP injection
server.forward-headers-strategy=none