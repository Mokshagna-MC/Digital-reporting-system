spring.application.name=digital-reporting-system

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/reporting_system
spring.datasource.username=postgres
spring.datasource.password=mokshagna0402
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA configuration (automatically creates and updates tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port (8081 avoids conflict with existing httpd/Apache on port 8080)
server.port=8081